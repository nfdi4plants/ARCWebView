# Runs on every push to main.
# Tests and GH Pages deployment always run.
# npm publish only runs when CHANGELOG.md contains a version not yet on npm.
name: Publish
description: Runs tests, deploys the showcase to GitHub Pages, and publishes the npm package when the CHANGELOG version is new.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that is already running finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm i
      - run: npm test

  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.sync.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: sync
        run: node ci/SyncChangelogVersion.mjs

  build-gh-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm i
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish-npm-package:
    needs: [check-version, test]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm i
      - run: node ci/SyncChangelogVersion.mjs
      - run: npm run build:lib
      - run: npm publish --access public

  deploy:
    needs: build-gh-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
